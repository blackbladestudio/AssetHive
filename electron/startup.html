<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; img-src 'self'; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
  <title>AssetHive</title>
  <style>
    :root { color-scheme: dark; font-family: Inter, 'Microsoft YaHei', sans-serif; }
    * { box-sizing: border-box; }
    html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; }
    body { background: #181818; color: #e0e0e0; user-select: none; }
    .splash { height: 100%; display: flex; flex-direction: column; justify-content: space-between; padding: 32px; border: 1px solid #333; -webkit-app-region: drag; }
    .close { position: absolute; top: 8px; right: 8px; width: 32px; height: 32px; padding: 0; border: 0; border-radius: 5px; background: transparent; color: #a0a0a0; font-size: 23px; cursor: pointer; -webkit-app-region: no-drag; }
    .close:hover { background: #2c2c2c; color: #fff; }
    .close:focus-visible { outline: 2px solid #2196f3; outline-offset: -2px; }
    .brand { display: flex; align-items: center; gap: 14px; }
    .logo { width: 48px; height: 48px; object-fit: contain; }
    h1 { margin: 0; color: #fff; font-size: 24px; font-weight: 600; letter-spacing: .3px; }
    .edition { margin-top: 6px; font-size: 9px; letter-spacing: 1.6px; color: #858585; }
    .status { margin-bottom: 12px; color: #a0a0a0; font-size: 12px; }
    .progress { height: 8px; overflow: hidden; border-radius: 2px; background: #303030; }
    .progress::before { content: ''; display: block; width: 38%; height: 100%; border-radius: inherit; background: #2196f3; animation: progress 1.6s ease-in-out infinite; }
    .en { display: none; }
    html[lang="en"] .zh { display: none; }
    html[lang="en"] .en { display: inline; }
    @keyframes progress { from { transform: translateX(-100%); } to { transform: translateX(264%); } }
    @media (prefers-reduced-motion: reduce) { .progress::before { animation: none; transform: translateX(82%); } }
  </style>
</head>
<body>
  <main class="splash" aria-busy="true">
    <button class="close" type="button" aria-label="关闭" title="关闭">×</button>
    <div class="brand">
      <img class="logo" src="./v2.ico" alt="" aria-hidden="true">
      <div>
        <h1>Asset Hive</h1>
        <div class="edition">BLACK BLADE EDITION</div>
      </div>
    </div>
    <div>
      <div class="status" role="status"><span class="zh">正在启动…</span><span class="en">Starting…</span></div>
      <div class="progress" role="progressbar" aria-label="正在启动" aria-valuemin="0" aria-valuemax="100"></div>
    </div>
  </main>
  <script>
    const closeButton = document.querySelector('.close');
    if (new URLSearchParams(location.search).get('lang') === 'en') {
      document.documentElement.lang = 'en';
      closeButton.title = 'Close';
      closeButton.setAttribute('aria-label', 'Close');
      document.querySelector('.progress').setAttribute('aria-label', 'Starting');
    }
    closeButton.addEventListener('click', () => window.startup?.close());
  </script>
</body>
</html>
