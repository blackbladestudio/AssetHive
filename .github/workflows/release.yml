name: Release Windows installers

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      GH_TOKEN: ${{ github.token }}
      ASSETHIVE_NO_PAUSE: "1"
    steps:
      - uses: actions/checkout@v5
        with:
          lfs: true
      - uses: actions/setup-node@v5
        with:
          node-version: "24.21.0"
          cache: npm
      - name: Validate version and immutable release
        shell: pwsh
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          if ($env:GITHUB_REF_NAME -ne "v$version") { throw 'Tag must match package.json' }
          gh release view $env:GITHUB_REF_NAME --repo $env:GITHUB_REPOSITORY *> $null
          if ($LASTEXITCODE -eq 0) { throw 'This release already exists; use a new version' }
          $global:LASTEXITCODE = 0
          if (-not (Test-Path "docs/release-notes-$version.md")) { throw 'Missing release notes' }
          "ASSETHIVE_VERSION=$version" >> $env:GITHUB_ENV
      - name: Install locked dependencies
        run: npm ci --include=optional
      - name: Check types and update compatibility
        shell: pwsh
        run: |
          npm run typecheck
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          npm run test:updates
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          npm run test:character
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Install official Inno Setup
        shell: pwsh
        run: |
          $release = gh api repos/jrsoftware/issrc/releases/tags/is-6_7_3 | ConvertFrom-Json
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          $url = ($release.assets | Where-Object name -eq 'innosetup-6.7.3.exe').browser_download_url
          if (-not $url) { throw 'Official installer not found' }
          $installer = Join-Path $env:RUNNER_TEMP 'innosetup.exe'
          Invoke-WebRequest -Uri $url -OutFile $installer
          if ((Get-AuthenticodeSignature $installer).Status -ne 'Valid') { throw 'Invalid Inno Setup signature' }
          $target = Join-Path $env:GITHUB_WORKSPACE 'tools/InnoSetup'
          $process = Start-Process $installer -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART','/SP-','/CURRENTUSER','/NOICONS',"/DIR=$target" -Wait -PassThru
          if ($process.ExitCode) { throw 'Inno Setup installation failed' }
      - name: Build and verify Windows installers
        shell: pwsh
        run: |
          npm run package:msi -- -KeepStage
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          node scripts/verify-release-package.cjs
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Optional signing and final checksums
        shell: pwsh
        env:
          CERTIFICATE_BASE64: ${{ secrets.WINDOWS_CERTIFICATE_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          $names = @("AssetHive-$env:ASSETHIVE_VERSION-Windows.msi", "AssetHive-$env:ASSETHIVE_VERSION-Windows-setup.exe", "AssetHive-$env:ASSETHIVE_VERSION-setup-win64.exe")
          if ($env:CERTIFICATE_BASE64) {
            $pfx = Join-Path $env:RUNNER_TEMP 'assethive-signing.pfx'
            [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:CERTIFICATE_BASE64))
            $certificate = [Security.Cryptography.X509Certificates.X509Certificate2]::new($pfx,$env:CERTIFICATE_PASSWORD)
          }
          foreach ($name in $names) {
            $file = Join-Path 'Output' $name
            if ((Get-Item $file).Length -lt 1MB) { throw "Invalid installer: $name" }
            if ($certificate) {
              $signature = Set-AuthenticodeSignature -FilePath $file -Certificate $certificate -HashAlgorithm SHA256 -TimestampServer 'http://timestamp.digicert.com'
              if ($signature.Status -ne 'Valid') { throw "Signing failed: $name" }
            }
            $hash = (Get-FileHash $file -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $name" | Set-Content "$file.sha256" -Encoding ascii
          }
      - name: Publish immutable release
        shell: pwsh
        run: |
          $assets = @()
          foreach ($suffix in @('Windows.msi','Windows-setup.exe','setup-win64.exe')) {
            $file = "Output/AssetHive-$env:ASSETHIVE_VERSION-$suffix"
            $assets += $file
            $assets += "$file.sha256"
          }
          gh release create $env:GITHUB_REF_NAME @assets --repo $env:GITHUB_REPOSITORY --verify-tag --title "AssetHive $env:ASSETHIVE_VERSION" --notes-file "docs/release-notes-$env:ASSETHIVE_VERSION.md" --latest
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
